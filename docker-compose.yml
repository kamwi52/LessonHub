version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lessonshub-postgres
    environment:
      POSTGRES_USER: lessonshub_user
      POSTGRES_PASSWORD: lessonshub_password
      POSTGRES_DB: lessonshub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lessonshub_user -d lessonshub_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lessonshub-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lessonshub-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lessonshub_user:lessonshub_password@postgres:5432/lessonshub_dev
      JWT_SECRET: your_secret_key_change_this_in_production
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lessonshub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lessonshub-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    networks:
      - lessonshub-network

volumes:
  postgres_data:

networks:
  lessonshub-network:
    driver: bridge
